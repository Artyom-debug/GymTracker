services:
  postgres:
    image: postgres:17
    container_name: gymtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymtracker-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__YourDbContextConnection: Host=postgres;Port=5432;Database=gymtracker;Username=postgres;Password=postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
